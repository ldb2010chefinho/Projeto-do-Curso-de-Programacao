<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lista de Convidados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Lista de Convidados</h1>

    <div class="input-area">
        <input type="text" id="guestName" placeholder="Insira o nome do convidado">
        <button id="add">Adicionar</button>
    </div>

    <div id="actions">
        <button id="sort_list">Organizar lista</button>
        <button id="clean_list">Limpar lista</button>
        <button id="download_list">Baixar lista</button>
    </div>

    <div class="list-guest">
        <ul id="guest-list"></ul>
    </div>

</div>
<script src="script.js" defer></script>
</body>
</html>
