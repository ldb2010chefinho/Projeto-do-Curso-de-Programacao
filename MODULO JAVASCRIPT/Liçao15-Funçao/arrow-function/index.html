<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
    <script>
///////////////////////////////////////////////////////
        function somar(x, y){
            return x + y;
        }
        let resultado = somar(25, 42)
        console.log(resultado);
///////////////////////////////////////////////////////
        let multiplicar = (x,y) => {
            return x*y
        }
        console.log(multiplicar(33.5, 2));
///////////////////////////////////////////////////////        
        let subtrair = (x,y) => x - y;
        console.log(subtrair(187, 120));         
//////////////////////////////////////////////////////
    </script>
</head>
<body>
    <h1>Arrow Function</h1>
</body>
</html>
